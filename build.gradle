plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'com.gradleup.shadow' version '9.3.1'
}
version = project.mod_version
group = 'id.loclive'
base { archivesName = 'LocLive-Singleplayer-RinxAsoy-' + project.minecraft_version }
repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://jitpack.io' }
}
configurations { tikTokRuntime }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    tikTokRuntime 'com.github.jwdeveloper.TikTok-Live-Java:Client:1.13.0-Release'
}
tasks.named('shadowJar') {
    configurations = [project.configurations.tikTokRuntime]
    archiveClassifier = 'bundled'
    // This is a prototype build recipe and must pass Gradle/Fabric validation.
    from sourceSets.main.output
}
tasks.named('remapJar') { inputFile = tasks.named('shadowJar').flatMap { it.archiveFile } }
tasks.named('remapJar') { dependsOn tasks.named('shadowJar') }
processResources { filesMatching('fabric.mod.json') { /* Metadata is already versioned. */ } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }
java { toolchain.languageVersion=JavaLanguageVersion.of(25) }
